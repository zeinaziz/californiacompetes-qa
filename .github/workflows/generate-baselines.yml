name: Generate Baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Generate baselines
        run: node scripts/check.js
        env:
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}

      # Refuse to commit if any page was blocked by bot protection. This is
      # exactly how the previous baselines ended up being Cloudflare
      # "verify you are human" pages instead of the real site.
      - name: Guard against blocked captures
        run: |
          node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync("results.json", "utf-8"));
            const vps = r.pages.flatMap(p => Object.values(p.viewports));
            const blocked = vps.filter(v => v && v.blocked);
            const captured = vps.filter(v => v && !v.blocked && !v.error);
            if (blocked.length > 0) {
              console.error(`Refusing to commit: ${blocked.length} page(s) were blocked by bot protection.`);
              console.error("These would be Cloudflare challenge screenshots, not the real site.");
              console.error("Set the CF_CLEARANCE secret or run from an allow-listed IP, then retry.");
              process.exit(1);
            }
            if (captured.length === 0) {
              console.error("Refusing to commit: no valid captures were produced.");
              process.exit(1);
            }
            console.log(`OK: ${captured.length} valid captures, 0 blocked.`);
          '

      - name: Commit baselines
        run: |
          cp current/*.png baselines/
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add baselines/
          git diff --staged --quiet || git commit -m "chore: update visual baselines from CI"
          git push
